<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">Campaign estimates under five specifications</title>
  <desc id="desc">Four observational estimates cluster around 5.5 percentage points; a mediator-adjusted estimate is near zero. The analysis is assumption-dependent and does not establish causality.</desc>
  <rect width="720" height="300" fill="#fbfaf7"/>
  <text x="28" y="32" fill="#66665f" font-family="Arial, sans-serif" font-size="12" letter-spacing="1.2">CAMPAIGN ESTIMATES · OBSERVATIONAL DATA</text>
  <g fill="#393a35" font-family="Arial, sans-serif" font-size="13">
    <text x="28" y="83">Naive difference</text><text x="28" y="120">OLS · pre-treatment controls</text>
    <text x="28" y="157">Propensity matching</text><text x="28" y="194">Inverse-propensity weighting</text>
    <text x="28" y="231">OLS · includes impressions and clicks</text>
  </g>
  <g stroke="#d5d1c8" stroke-width="1">
    <line x1="330" y1="53" x2="330" y2="246"/><line x1="398" y1="53" x2="398" y2="246"/>
    <line x1="466" y1="53" x2="466" y2="246"/><line x1="534" y1="53" x2="534" y2="246"/>
    <line x1="602" y1="53" x2="602" y2="246"/><line x1="670" y1="53" x2="670" y2="246"/>
  </g>
  <g stroke="#8b8982" stroke-width="2" fill="#8b8982">
    <line x1="330" y1="78" x2="518" y2="78"/><circle cx="518" cy="78" r="5"/>
    <line x1="330" y1="115" x2="517" y2="115"/><circle cx="517" cy="115" r="5"/>
    <line x1="330" y1="152" x2="532" y2="152"/><circle cx="532" cy="152" r="5"/>
    <line x1="330" y1="189" x2="517" y2="189"/><circle cx="517" cy="189" r="5"/>
  </g>
  <g stroke="#a3341c" stroke-width="2" fill="#fbfaf7">
    <line x1="330" y1="226" x2="329" y2="226"/><circle cx="329" cy="226" r="5"/>
  </g>
  <g fill="#393a35" font-family="Arial, sans-serif" font-size="12" font-weight="700">
    <text x="528" y="82">+5.53</text><text x="527" y="119">+5.52</text><text x="542" y="156">+5.95</text>
    <text x="527" y="193">+5.51</text><text x="340" y="230">−0.02</text>
  </g>
  <g fill="#66665f" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">
    <text x="330" y="264">0</text><text x="398" y="264">2</text><text x="466" y="264">4</text>
    <text x="534" y="264">6</text><text x="602" y="264">8</text>
  </g>
  <text x="28" y="286" fill="#66665f" font-family="Arial, sans-serif" font-size="11">Point estimates; assumptions matter. Observational analysis does not prove causality.</text>
</svg>
